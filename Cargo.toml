[workspace]
resolver = "3"
members = ["components-rs", "theme-designer", "themelib"]

[workspace.package]
authors = ["Jonathon Cobb"]
version = "0.1.0"

[workspace.dependencies]
anyhow = "1.0.102"
byteorder = "1.5.0"
clap = "4.6.1"
crossterm = "0.29.0"
getrandom = "0.4.3"
glam = "0.33.1"
image = { version = "0.25.10", default-features = false }
itertools = "0.15.0"
js-sys = "0.3.104"
lazy_static = "1.5.0"
leptos = "0.8.19"
leptos-use = "0.19.0"
rand = "0.10.3"
regex = "1.12.4"
semver = "1.0.28"
serde = "1.0.228"
serde_json = "1.0.151"
toml = "1.1.2"
wasm-bindgen = "0.2.125"
web-sys = "0.3.102"
