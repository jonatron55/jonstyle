[meta]
name = "Venusian Kumquat"
version = "1.0.0"
variants = [
    { name = "Light", mode = "Light", temp = "Cool" },
    { name = "Dark", mode = "Dark", temp = "Cool" },
]
default_variant = "Dark"

[hue]
mode = "Complementary"
primary = 253.0
spread = 30.0
offset = -206.0
reverse = false

[lum]
range = [8.0, 96.0]
alpha = 1.1
gamma = 1.05

[sat]
muted_range = [15.0, 30.0]
base_range = [60.0, 80.0]
intense_range = [90.0, 100.0]

[code]
vocab = "VisualStudio"
bold_keywords = true
bold_punctuation = true
italic_comments = true
italic_strings = true
