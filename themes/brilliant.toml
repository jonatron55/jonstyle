[meta]
name = "Brilliant"
author = "Jonathon Cobb"
version = "0.1.0"
variants = [
    { name = "Dawn", mode = "Light", temp = "Warm", },
    { name = "Dusk", mode = "Dark", temp = "Warm", },
    { name = "Noon", mode = "Light", temp = "Cool", },
    { name = "Night", mode = "Dark", temp = "Cool", }
]

[hue]
mode = "Complementary"
primary = 240.0
spread = -70.0
offset = 200.0
reverse = false

[lum]
range = [5.0, 95.0]
alpha = 1.28
gamma = 0.94

[sat]
muted_range = [20.0, 25.0]
base_range = [33.0, 66.0]
intense_range = [85.0, 95.0]

[code]
vocab = "JonStyle"
bold_keywords = true
bold_punctuation = true
italic_comments = true
italic_strings = true
